<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junction 2K26 Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header with next deadline, 42h event timeline, then ticket list beside repo activity. */
:root {
  --bg: #edf0f2; --panel: #f8fafb; --ink: #14202a; --muted: #5b6873; --line: #d3d9de;
  --accent: #1d5fb0; --blocked: #b42318; --review: #9a5800; --done: #2f7a4a;
  --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --panel: #161e24; --ink: #e3e9ee; --muted: #8d9aa5; --line: #27323b;
    --accent: #6ea8ee; --blocked: #f2786b; --review: #e0a64a; --done: #6cc08d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --panel: #161e24; --ink: #e3e9ee; --muted: #8d9aa5; --line: #27323b;
  --accent: #6ea8ee; --blocked: #f2786b; --review: #e0a64a; --done: #6cc08d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--ui);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
h2 .count { font: 500 13px var(--mono); color: var(--muted); }

header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.sync { font-size: 13px; }
.sync.bad { color: var(--blocked); }
.next { text-align: right; }
.next .left { font: 600 28px/1.1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.timeline { display: grid; gap: 10px; }
.bar { position: relative; height: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; }
.bar .past { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .22; }
.bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--muted); transform: translateX(-1px); }
.bar .tick.hard { background: var(--ink); }
.bar .now { position: absolute; top: -7px; bottom: -7px; width: 2px; background: var(--accent); transform: translateX(-1px); }
.days { position: relative; height: 16px; font-size: 12px; color: var(--muted); }
.days span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.deadlines { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.deadlines li { list-style: none; display: flex; gap: 6px; align-items: baseline; }
.deadlines ul, ul.deadlines { margin: 0; padding: 0; }
.deadlines .passed { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.deadlines .soon b { color: var(--accent); }

.decision { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 24px; }
.decision dt { font-size: 12px; color: var(--muted); }
.decision dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.decision.empty dd { color: var(--muted); font-weight: 400; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
@media (max-width: 880px) { main { grid-template-columns: minmax(0, 1fr); } .next { text-align: left; } }

.groups { display: grid; gap: 22px; }
.group { display: grid; gap: 8px; }
.rows { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; }
.row { display: grid; grid-template-columns: 4px 44px minmax(0, 1fr) auto; gap: 0 12px; align-items: center;
  padding: 10px 14px 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .stripe { grid-row: 1 / span 3; align-self: stretch; margin-block: -10px; background: var(--muted); }
.row .id { color: var(--muted); }
.row .title { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.row .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: end; font-size: 13px; color: var(--muted); }
.row .owner { color: var(--ink); font-weight: 600; }
.row .meta .mono { font-size: 12px; }
@media (max-width: 560px) {
  .row { grid-template-columns: 4px 36px minmax(0, 1fr); }
  .row .meta { grid-column: 3; justify-content: start; margin-top: 4px; }
}
.s-blocked .stripe { background: var(--blocked); } .s-blocked h2 { color: var(--blocked); }
.s-doing .stripe { background: var(--accent); }
.s-review .stripe { background: var(--review); }
.s-done .stripe { background: var(--done); } .s-done .title { color: var(--muted); font-weight: 400; }
.none { font-size: 13px; color: var(--muted); padding: 2px 0; }

aside { display: grid; gap: 22px; min-width: 0; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feed li { display: grid; gap: 1px; min-width: 0; }
.feed .line1 { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.feed .line1 .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.feed .when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.feed .what { font-size: 14px; overflow-wrap: anywhere; }
.feed .who { color: var(--muted); }

.row .q { grid-column: 3 / -1; margin-top: 4px; font-size: 13px; color: var(--blocked); overflow-wrap: anywhere; }
.row .area { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 6px; font-weight: 400; }
.feed a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 3px; }
.feed a:hover { text-decoration-color: var(--accent); }
.verdict { font-size: 12px; font-weight: 600; white-space: nowrap; }
.verdict.pass { color: var(--done); } .verdict.blocking { color: var(--blocked); } .verdict.none, .verdict.posted { color: var(--muted); font-weight: 400; }
.error { border: 1px solid var(--blocked); color: var(--blocked); border-radius: 4px; padding: 12px 14px; }
.error code { font-family: var(--mono); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Junction 2K26</h1>
      <div class="sync muted" id="sync">Connecting…</div>
    </div>
    <div class="next" id="next"></div>
  </header>

  <section class="timeline" aria-label="Event timeline">
    <div class="bar" id="bar"></div>
    <div class="days" id="days"></div>
    <ul class="deadlines" id="deadlines"></ul>
  </section>

  <dl class="decision empty" id="decision"></dl>

  <div id="error" hidden></div>

  <main>
    <div class="groups" id="groups"></div>
    <aside>
      <section class="group"><h2>Pull requests <span class="count" id="prcount"></span></h2><ul class="feed" id="prs"></ul></section>
      <section class="group"><h2>Active branches</h2><ul class="feed" id="branches"></ul></section>
      <section class="group"><h2>Log</h2><ul class="feed" id="log"></ul></section>
      <section class="group"><h2>Merged to main</h2><ul class="feed" id="commits"></ul></section>
    </aside>
  </main>
</div>

<script>
// Helsinki is UTC+2 in November.
const T = (s) => new Date(s + "+02:00").getTime();
const START = T("2026-11-13T16:00:00"), END = T("2026-11-15T10:00:00");
const DEADLINES = [
  { at: T("2026-11-13T18:00:00"), name: "Opening" },
  { at: T("2026-11-13T21:00:00"), name: "Idea decided" },
  { at: T("2026-11-13T23:55:00"), name: "Preliminary submission", hard: true },
  { at: T("2026-11-14T22:00:00"), name: "Feature freeze" },
  { at: T("2026-11-15T10:00:00"), name: "Final submission", hard: true },
];
const GROUPS = [
  ["blocked", "Blocked", "Nothing blocked."],
  ["doing", "Doing", "Nobody is on a ticket."],
  ["review", "Review", "Nothing waiting for review."],
  ["todo", "To do", "Queue is empty."],
  ["done", "Done", "Nothing finished yet."],
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = (t) => new Date(t).toLocaleString("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Helsinki" });
const pct = (t) => Math.min(100, Math.max(0, ((t - START) / (END - START)) * 100));

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
function span(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
}

function drawTimeline() {
  const now = Date.now();
  const ticks = DEADLINES.map((d) => `<i class="tick${d.hard ? " hard" : ""}" style="left:${pct(d.at)}%" title="${esc(d.name)}"></i>`).join("");
  const nowMark = now > START && now < END ? `<i class="now" style="left:${pct(now)}%"></i>` : "";
  $("bar").innerHTML = `<div class="past" style="width:${pct(now)}%"></div>${ticks}${nowMark}`;
  $("days").innerHTML = [["Fri 16:00", START], ["Sat", T("2026-11-14T00:00:00")], ["Sun", T("2026-11-15T00:00:00")], ["Sun 10:00", END]]
    .map(([l, t], i, a) => `<span style="left:${pct(t)}%;${i === 0 ? "transform:none" : i === a.length - 1 ? "transform:translateX(-100%)" : ""}">${l}</span>`).join("");

  const next = DEADLINES.find((d) => d.at > now);
  $("deadlines").innerHTML = DEADLINES.map((d) =>
    `<li class="${d.at <= now ? "passed" : d === next ? "soon" : ""}"><b>${esc(d.name)}</b><span class="mono muted">${clock(d.at)}</span></li>`).join("");
  $("next").innerHTML = next
    ? `<div class="muted">${esc(next.name)} in</div><div class="left">${span(next.at - now)}</div>`
    : `<div class="left">Submitted</div>`;
}

function parseTasks(md) {
  const lines = md.split("\n").filter((l) => l.trim().startsWith("|"));
  if (lines.length < 2) return [];
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const head = cells(lines[0]).map((h) => h.toLowerCase());
  return lines.slice(2).map(cells).map((c) => {
    const get = (k) => c[head.indexOf(k)] ?? "";
    const m = get("ticket").match(/^(T\d+)\s+(.*)$/i);
    const status = get("status").replace(/`/g, "").toLowerCase() || "todo";
    return { id: m ? m[1] : "", title: m ? m[2] : get("ticket"), owner: get("owner"), status, branch: get("branch"),
      device: get("device"), area: get("area"), question: get("question") };
  }).filter((r) => r.title);
}

function drawTasks(md) {
  const rows = parseTasks(md);
  $("groups").innerHTML = GROUPS.map(([key, label, empty]) => {
    const items = rows.filter((r) => (GROUPS.some((g) => g[0] === r.status) ? r.status : "todo") === key);
    const body = items.length
      ? `<div class="rows">${items.map((r) => `
          <div class="row">
            <span class="stripe"></span>
            <span class="id mono">${esc(r.id)}</span>
            <span class="title">${esc(r.title)}${r.area ? `<span class="area">${esc(r.area)}</span>` : ""}</span>
            <span class="meta">
              ${r.owner ? `<span class="owner">${esc(r.owner)}</span>` : `<span>Unclaimed</span>`}
              ${r.branch ? `<span class="mono">${esc(r.branch)}</span>` : ""}
              ${r.device ? `<span>${esc(r.device)}</span>` : ""}
            </span>
            ${r.question ? `<span class="q">Question: ${esc(r.question)}</span>` : ""}
          </div>`).join("")}</div>`
      : `<div class="none">${empty}</div>`;
    return `<section class="group s-${key}"><h2>${label}<span class="count">${items.length}</span></h2>${body}</section>`;
  }).join("");
}

function drawDecision(md) {
  const field = (k) => (md.match(new RegExp(`\\*\\*${k}:\\*\\*[ \\t]*([^\\n]*)`, "i")) || [])[1]?.trim() || "";
  const f = { Challenge: field("Challenge"), Idea: field("Idea"), Pitch: field("One-line pitch") };
  const decided = Object.values(f).some(Boolean);
  $("decision").classList.toggle("empty", !decided);
  $("decision").innerHTML = decided
    ? Object.entries(f).map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v || "Not set")}</dd></div>`).join("")
    : `<div><dt>Idea</dt><dd>Not decided yet. Target Fri 21:00, written to DECISION.md.</dd></div>`;
}

const VERDICT = { pass: "Review passed", blocking: "Review blocking", posted: "Reviewed", none: "Not reviewed" };
function drawPrs(s) {
  $("prcount").textContent = s.prs ? s.prs.length : "";
  if (!s.prs) { $("prs").innerHTML = `<li class="none">${esc(s.prError || "Loading…")}</li>`; return; }
  $("prs").innerHTML = s.prs.length
    ? s.prs.map((p) => `<li><div class="line1"><a href="${esc(p.url)}" target="_blank" rel="noopener">#${p.number} ${esc(p.title)}</a>
        <span class="verdict ${p.review}">${p.draft ? "Draft" : VERDICT[p.review]}</span></div>
        <div class="what"><span class="mono muted">${esc(p.branch)}</span> <span class="who">· ${esc(p.author)} · ${ago(p.updatedAt)}</span></div></li>`).join("")
    : `<li class="none">No open pull requests.</li>`;
}

function drawFeeds(s) {
  drawPrs(s);
  const branches = s.branches.filter((b) => b.name !== "main");
  $("branches").innerHTML = branches.length
    ? branches.map((b) => `<li><div class="line1"><span class="mono">${esc(b.name)}</span><span class="when">${ago(b.date)}</span></div>
        <div class="what">${esc(b.subject)} <span class="who">· ${esc(b.author)}</span></div></li>`).join("")
    : `<li class="none">No branches pushed yet.</li>`;

  const log = s.log.split("\n").filter((l) => l.startsWith("- ")).slice(0, 8);
  $("log").innerHTML = log.length
    ? log.map((l) => `<li class="what">${esc(l.slice(2))}</li>`).join("")
    : `<li class="none">LOG.md is empty.</li>`;

  $("commits").innerHTML = s.commits.slice(0, 8).map((c) =>
    `<li><div class="line1"><span class="mono muted">${esc(c.hash)}</span><span class="when">${ago(c.date)}</span></div>
      <div class="what">${esc(c.subject)} <span class="who">· ${esc(c.author)}</span></div></li>`).join("");
}

let lastOk = 0;
async function refresh() {
  try {
    const s = await (await fetch("/api/state", { cache: "no-store" })).json();
    lastOk = Date.now();
    $("error").hidden = true;
    drawTasks(s.tasks); drawDecision(s.decision); drawFeeds(s);
    const sync = $("sync");
    sync.classList.toggle("bad", !!s.fetchError);
    sync.textContent = s.fetchError
      ? `Can't reach GitHub, showing last fetched ${s.ref}`
      : `Live from ${s.ref} · refreshes every 30s`;
  } catch {
    $("error").hidden = false;
    $("error").className = "error";
    $("error").innerHTML = `Board server not reachable. Run <code>node board/serve.mjs</code> in the repo, then reload.`;
    $("sync").textContent = lastOk ? `Last update ${ago(new Date(lastOk).toISOString())}` : "Offline";
  }
}

drawTimeline();
refresh();
setInterval(drawTimeline, 30_000);
setInterval(refresh, 30_000);
</script>
</body>
</html>
